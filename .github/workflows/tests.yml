name: tests

# Both boot services in this repo, the skin's keymap writer and
# service.tvos.pythonfix's _scproxy shim, are tvOS-only and MUST stay a no-op on
# Fire OS. That is asserted by tests/test_services_keymap.py and
# tests/test_pythonfix_service.py, and this workflow is what makes the assertion
# binding rather than intended. The same suite also pins the ORDER in which the
# skin declares its dependencies, which is what makes a fresh install work.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest tests/ -q
      - run: ruff check skin.estuary.pov/scripts/ service.tvos.pythonfix/scripts/ tools/ tests/
      - name: the zips must be byte-reproducible
        run: |
          python tools/build_skin.py skin.estuary.pov --check
          python tools/build_skin.py service.tvos.pythonfix --check
