# Upstream's own ruff configuration, copied verbatim from
# MikeSiLVO/script.skinshortcuts so this fork is linted by the same rules its
# code was written against, and so a hand merge from upstream compares cleanly.
extend-exclude = ["typings"]
line-length = 100
target-version = "py314"

# SECOND ADDITION TO UPSTREAM'S CONFIG, ADDED 2026-07-31. NOT upstream's; drop
# it if it ever fights a hand merge, but read this first.
#
# The formatter exclusion below only holds while the caller passes
# --force-exclude. MEASURED 2026-07-31 on dialog/items.py: with the flag, ruff
# format is a silent no-op; WITHOUT it, the same file reformats (3 hunks, exit
# 1). The global auto-format hook does pass it today, so the guard works, but it
# rests entirely on a flag in a file outside this repo.
#
# It also does nothing for the OTHER half of that hook, `ruff check --fix`,
# which is not excluded here at all (linter.exclude is empty by design, because
# upstream's lint rules are wanted). Today that is latent rather than live: the
# fork has 23 findings under upstream's rules, 22 E501 and 1 B904, and `ruff
# check --diff` produces an empty diff, so nothing is autofixable. One future
# unused import would change that, and F is selected.
#
# required-version closes both holes with one key, independently of any flag: a
# ruff that is not this version refuses to run at all, and the hook's `|| true`
# turns the refusal into a no-op. Ruff configs do not inherit, so the identical
# pin in the repo-root ruff.toml does NOT reach these files; that is why it is
# repeated here.
#
# It has a THIRD statement as of 2026-08-06: ../../requirements-ci.txt, which
# bin/check installs into a cached venv so the gate no longer depends on
# whatever ruff is on PATH. Homebrew shipping 0.16.1 on 2026-08-05 had made
# this same key refuse at config load and took bin/check's format and lint legs
# offline entirely. Change all three together.
required-version = "==0.16.0"

[lint]
select = ["E4", "E7", "E9", "F", "B", "PLE", "ASYNC"]
extend-select = ["E501"]   # Line too long (enforced at line-length above)
ignore = ["E402"]          # Module level import not at top - needed for Kodi addon initialization order

# THE ONLY ADDITION TO UPSTREAM'S CONFIG, AND IT IS LOAD-BEARING.
#
# Upstream never runs `ruff format`; their CI runs `ruff check` and pyright only.
# Their source is therefore NOT ruff-format-clean, and running the formatter over
# it rewrites code that has nothing to do with any change being made: measured on
# 2026-07-30, a two-method addition to dialog/pickers.py came back with 78 changed
# lines, including moved imports and reflowed expressions elsewhere in the file.
#
# That matters more here than in ordinary code. This fork's whole maintenance
# story is that it stays diffable against upstream so their fixes can be carried
# across by hand. A formatter pass destroys that in one edit, silently.
#
# The global PostToolUse auto-format hook invokes ruff with --force-exclude
# specifically so a project's own exclusions are honoured for explicitly named
# paths, so this is the supported way to opt out. `ruff check` is unaffected and
# still runs with upstream's rules above.
[format]
exclude = ["*"]
